<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <script type="text/javascript">
      // Redirect unknown routes to index.html while keeping path
      const repo = "/GreenStore"; // your repo
      const path = location.pathname.replace(repo, "");
      window.location.href = repo + "/?" + path;
    </script>
  </head>
  <body></body>
</html>
